[package]
name = "crownos-polkit-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The CrownOS polkit authentication agent and its CrownUI password prompt"
license = "MIT"

[[bin]]
name = "crownos-polkit-agent"
path = "src/main.rs"

[[bin]]
name = "crownos-polkit-dialog"
path = "src/bin/crownos-polkit-dialog.rs"
required-features = ["dialog"]

[features]
default = ["dialog"]
dialog = ["dep:crownui"]

[dependencies]
anyhow = "1"
crownui = { path = "../crownui/crownui", default-features = false, features = ["wayland", "impeller", "static", "tokio", "accessibility"], optional = true }
nix = { version = "0.31", default-features = false, features = ["user"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "net", "io-util", "sync", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
crowntest = { path = "../crownui/crowntest" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
