# Builds an Arch package on a v* tag and publishes it on the release.
# Logic lives in Crown-OS/.github. polkit provides polkit-agent-helper-1, which
# the dialog runs for the password conversation.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    uses: Crown-OS/.github/.github/workflows/arch-package.yml@main
    with:
      depends: wayland libxkbcommon vulkan-icd-loader polkit
    secrets: inherit
